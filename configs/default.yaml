  M: 30           # moving average window
  stop_loss_r: 0.1

diversification:
  rebalance_window: 63   # quarterly
  methods: [EW, MRB, MRR, MVA]
  method_choosed: "MRR"

signature:
  truncation_order: 3
  threshold_k: 0.05
  sigmoid_mu: 20
  n_train_samples: 100
  discount_rate: 0.01
  transaction_cost: 0.001

rl:
  lookback_l: 4
  threshold_k_pct: 3.0
  learning_rate: 0.1
  discount_factor: 0.99
  epsilon: 0.1
  n_episodes: 10
  n_train_paths: 10000

ou:
  hedge_ratio_grid: [-2.0, 2.0, 0.01]

sot:
  N: 3                    # signature truncation level
  k: 1.0                  # stopping threshold (Eq. 3.18)
  mu_sig: 20.0            # sigmoid sharpness (paper: 20)
  n_train_paths: 100      # M in Eq. 3.19
  horizon_days: 252       # trading period length in days
  r_entry: 0.0            # discount rate for entry payoff
  r_exit: 0.0             # discount rate for exit payoff
  c_entry: 0.0            # transaction cost c
  c_exit: 0.0             # transaction cost ĉ
  min_watch_days: 3       # cool-off bars after each refit
  seed: 0